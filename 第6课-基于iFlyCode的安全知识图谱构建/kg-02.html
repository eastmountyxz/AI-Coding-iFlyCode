<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>安全知识图谱 · D3 Force</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root{
    --bg: #ffffff;
    --fg: #1f2937;
    --muted:#6b7280;
    --panel:#f8fafc;
    --accent:#2563eb;
    --link:#94a3b8;
    --edge:#94a3b8;
    --chip:#e5e7eb;
    --shadow:0 4px 20px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1020; --fg:#e5e7eb; --muted:#94a3b8; --panel:#0f172a;
      --accent:#60a5fa; --link:#475569; --edge:#64748b; --chip:#1f2937;
      --shadow:0 8px 30px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
  header{display:flex;gap:.75rem;align-items:center;justify-content:space-between;padding:.8rem 1rem;border-bottom:1px solid var(--chip);position:sticky;top:0;background:var(--bg);z-index:10}
  header h1{margin:0;font-size:16px;font-weight:700}
  .toolbar{display:flex;gap:.5rem;flex-wrap:wrap}
  .toolbar input[type="search"]{padding:.5rem .7rem;border:1px solid var(--chip);border-radius:.5rem;background:transparent;color:var(--fg);min-width:240px}
  .btn{padding:.45rem .75rem;border-radius:.5rem;border:1px solid var(--chip);background:var(--panel);color:var(--fg);cursor:pointer;box-shadow:var(--shadow)}
  .btn:hover{border-color:var(--accent)}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:0}
  #graph-wrap{position:relative;height:calc(100vh - 60px);overflow:hidden}
  #sidebar{border-left:1px solid var(--chip);height:calc(100vh - 60px);padding:1rem;overflow:auto;background:var(--panel)}
  #legend{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0}
  .chip{display:inline-flex;gap:.4rem;align-items:center;padding:.25rem .5rem;border-radius:999px;background:var(--chip);color:var(--fg)}
  .dot{width:.75rem;height:.75rem;border-radius:999px;display:inline-block}
  .tip{position:absolute;pointer-events:none;background:var(--panel);padding:.4rem .55rem;border:1px solid var(--chip);border-radius:.5rem;box-shadow:var(--shadow);font-size:12px;opacity:0;transform:translate(-50%,-140%);}
  .sidebar-title{margin:.2rem 0 .6rem;font-weight:700}
  .small{color:var(--muted);font-size:12px}
  .item{padding:.3rem .4rem;border-radius:.4rem;border:1px dashed var(--chip);margin:.25rem 0}
  .note{margin-top:.8rem;color:var(--muted);font-size:12px}
  svg text{user-select:none}
</style>
</head>
<body>
<header>
  <h1>安全知识图谱（CSV → D3.forceSimulation）</h1>
  <div class="toolbar">
    <input id="search" type="search" placeholder="搜索实体名称（模糊匹配）…"/>
    <button id="fit" class="btn">重置视图</button>
    <button id="export" class="btn">导出PNG</button>
  </div>
</header>

<div class="layout">
  <div id="graph-wrap">
    <svg id="graph" width="100%" height="100%"></svg>
    <div id="tooltip" class="tip"></div>
  </div>
  <aside id="sidebar">
    <div class="sidebar-title">节点信息</div>
    <div id="node-info" class="small">点击节点查看一阶邻居与关系。</div>
    <div class="sidebar-title" style="margin-top:1rem">图例</div>
    <div id="legend"></div>
    <div class="note">CSV字段：entities(id,label,type)，relations(source,relation,target)。将CSV与本HTML置于同一目录。</div>
  </aside>
</div>

<script>
(async function(){
  // ---------- 配置 ----------
  const typeStyle = {
    AG:{color:"#ef4444", r:18, label:"APT组织"},
    AM:{color:"#eab308", r:14, label:"攻击手法"},
    AV:{color:"#22c55e", r:14, label:"攻击漏洞"},
    AE:{color:"#06b6d4", r:13, label:"攻击事件"},
    AT:{color:"#8b5cf6", r:13, label:"攻击目标"},
    AI:{color:"#f97316", r:13, label:"攻击行业"},
    MF:{color:"#10b981", r:12, label:"恶意文件"},
    MFA:{color:"#0ea5e9", r:12, label:"恶意家族"},
    RL:{color:"#f43f5e", r:12, label:"区域/国家"},
    OS:{color:"#64748b", r:12, label:"操作系统"},
    SI:{color:"#84cc16", r:12, label:"软件"}
  };
  const defaultType = {color:"#94a3b8", r:10, label:"其他"};

  // ---------- 数据加载（带回退文件名） ----------
  async function loadFirst(paths, loader){
    for(const p of paths){
      try{ return await loader(p); }catch(e){ /* try next */ }
    }
    throw new Error("未找到任何可用的CSV："+paths.join(", "));
  }
  const entities = await loadFirst(
    ["entities.csv","entity_final.csv"],
    p => d3.csv(p, d3.autoType)
  );
  const relations = await loadFirst(
    ["relations.csv","relation_final.csv"],
    p => d3.csv(p, d3.autoType)
  );

  // 构建索引
  const nodeById = new Map();
  entities.forEach(d=>{
    d.id = String(d.id);
    d.label = d.label ?? d.id;
    d.type = d.type ?? "OTHER";
    nodeById.set(d.id, d);
  });
  const links = relations
    .filter(d=>nodeById.has(String(d.source)) && nodeById.has(String(d.target)))
    .map(d=>({source:String(d.source), target:String(d.target), relation:d.relation ?? ""}));

  const nodes = Array.from(nodeById.values());

  // ---------- 画布 & 图层 ----------
  const svg = d3.select("#graph");
  const g = svg.append("g");
  const linkLayer = g.append("g").attr("class","links");
  const nodeLayer = g.append("g").attr("class","nodes");
  const labelLayer = g.append("g").attr("class","edge-labels"); // 边标签单独层，便于缩放

  const tooltip = d3.select("#tooltip");

  // ---------- 力导向仿真 ----------
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d=>d.id).distance(80).strength(0.4))
    .force("charge", d3.forceManyBody().strength(-260))
    .force("center", d3.forceCenter())
    .force("collide", d3.forceCollide().radius(d=> (typeStyle[d.type]?.r ?? defaultType.r)+6));

  // 自适应中心
  function resize(){
    const {width, height} = svg.node().getBoundingClientRect();
    sim.force("center", d3.forceCenter(width/2, height/2)).alpha(0.5).restart();
  }
  addEventListener("resize", resize);

  // ---------- 边 ----------
  const link = linkLayer.selectAll("line")
    .data(links)
    .enter().append("line")
    .attr("stroke","var(--edge)")
    .attr("stroke-opacity",0.8)
    .attr("stroke-width",1.2);

  // 边标签
  const edgeLabels = labelLayer.selectAll("text")
    .data(links)
    .enter().append("text")
    .attr("fill","var(--muted)")
    .attr("font-size",12)
    .attr("text-anchor","middle")
    .text(d=>d.relation || "");

  // ---------- 节点 ----------
  const node = nodeLayer.selectAll("g.node")
    .data(nodes)
    .enter().append("g")
    .attr("class","node")
    .call(d3.drag()
      .on("start", (event,d)=>{ if(!event.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag", (event,d)=>{ d.fx=event.x; d.fy=event.y; })
      .on("end", (event,d)=>{ if(!event.active) sim.alphaTarget(0); d.fx=null; d.fy=null; })
    );

  node.append("circle")
    .attr("r", d=> (typeStyle[d.type]?.r ?? defaultType.r))
    .attr("fill", d=> (typeStyle[d.type]?.color ?? defaultType.color))
    .attr("stroke","#000").attr("stroke-opacity",0.08);

  node.append("title").text(d=>`${d.label} [${d.type}]`);

  node.append("text")
    .attr("dy", d=> (typeStyle[d.type]?.r ?? defaultType.r)+12)
    .attr("text-anchor","middle")
    .attr("fill","var(--fg)")
    .attr("font-size",12)
    .text(d=>d.label);

  // ---------- 交互：悬停提示 ----------
  node.on("mousemove",(event,d)=>{
    tooltip.style("opacity",1)
      .style("left", (event.offsetX)+"px")
      .style("top", (event.offsetY-10)+"px")
      .html(`<b>${d.label}</b><br/><span class="small">Type: ${d.type}</span>`);
  }).on("mouseleave",()=> tooltip.style("opacity",0));

  link.on("mousemove",(event,d)=>{
    tooltip.style("opacity",1)
      .style("left", (event.offsetX)+"px")
      .style("top", (event.offsetY-10)+"px")
      .html(`<b>${nodeById.get(d.source.id||d.source)?.label} → ${nodeById.get(d.target.id||d.target)?.label}</b><br/><span class="small">Relation: ${d.relation}</span>`);
  }).on("mouseleave",()=> tooltip.style("opacity",0));

  // ---------- 点击高亮一阶邻居 ----------
  const sidebar = d3.select("#node-info");
  node.on("click",(event, d)=>{
    const nbr = new Set([d.id]);
    links.forEach(l=>{
      if(l.source.id===d.id) nbr.add(l.target.id);
      if(l.target.id===d.id) nbr.add(l.source.id);
    });
    node.selectAll("circle").attr("opacity", n=> nbr.has(n.id)?1:0.15);
    node.selectAll("text").attr("opacity", n=> nbr.has(n.id)?1:0.15);
    link.attr("stroke-opacity", l=> (l.source.id===d.id||l.target.id===d.id)?1:0.08);
    edgeLabels.attr("opacity", l=> (l.source.id===d.id||l.target.id===d.id)?1:0.05);

    // 侧栏列出关系
    const rels = links.filter(l=> l.source.id===d.id || l.target.id===d.id);
    sidebar.html(`<div><b>${d.label}</b> <span class="small">[${d.type}]</span></div>`+
      rels.map(l=>{
        const a = nodeById.get(l.source.id), b = nodeById.get(l.target.id);
        const other = (a.id===d.id)? b : a;
        return `<div class="item">${d.label} — <b>${l.relation||"relation"}</b> — ${other.label}</div>`;
      }).join("")
    );
  });

  // 背景点击取消高亮
  svg.on("click",(e)=>{
    if(e.target!==svg.node()) return;
    node.selectAll("circle, text").attr("opacity",1);
    link.attr("stroke-opacity",0.8);
    edgeLabels.attr("opacity",1);
    sidebar.html('点击节点查看一阶邻居与关系。');
  });

  // ---------- 缩放/平移（边标签随缩放等比缩放） ----------
  const zoom = d3.zoom()
    .scaleExtent([0.2, 5])
    .on("zoom",(event)=>{
      g.attr("transform", event.transform);
      const k = event.transform.k;
      edgeLabels.attr("font-size", 12/Math.sqrt(k)); // 随缩放柔和缩放
    });
  svg.call(zoom);

  // ---------- 搜索 ----------
  const search = document.getElementById("search");
  search.addEventListener("keydown", e=>{
    if(e.key!=="Enter") return;
    const q = e.target.value.trim().toLowerCase();
    if(!q) return;
    const hit = nodes.find(n => (n.label||"").toLowerCase().includes(q));
    if(!hit) return;
    // 居中并放大
    const t = d3.zoomTransform(svg.node());
    const {width, height} = svg.node().getBoundingClientRect();
    const scale = Math.min(3, Math.max(1.2, t.k));
    const x = (width/2 - (hit.x||0)*scale);
    const y = (height/2 - (hit.y||0)*scale);
    svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(x,y).scale(scale));
  });

  // 重置视图
  document.getElementById("fit").onclick = ()=>{
    const {width, height} = svg.node().getBoundingClientRect();
    svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(width/2, height/2).scale(1).translate(-width/2, -height/2));
  };

  // ---------- 导出 PNG ----------
  document.getElementById("export").onclick = async ()=>{
    const serializer = new XMLSerializer();
    const svgStr = serializer.serializeToString(svg.node());
    const canvas = document.createElement("canvas");
    const {width, height} = svg.node().getBoundingClientRect();
    canvas.width = width*2; canvas.height = height*2;
    const ctx = canvas.getContext("2d");
    const img = new Image();
    img.onload = ()=>{
      ctx.drawImage(img, 0,0, canvas.width, canvas.height);
      const a = document.createElement("a");
      a.download = "security-kg.png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgStr);
  };

  // ---------- 图例 ----------
  const typeKeys = Array.from(new Set(nodes.map(d=>d.type)));
  d3.select("#legend").selectAll("span")
    .data(typeKeys)
    .enter().append("span").attr("class","chip")
    .html(d=>{
      const st = typeStyle[d] || defaultType;
      return `<span class="dot" style="background:${st.color}"></span><span>${d}</span>`;
    });

  // ---------- 布局更新 ----------
  sim.on("tick", ()=>{
    link
      .attr("x1", d=>d.source.x).attr("y1", d=>d.source.y)
      .attr("x2", d=>d.target.x).attr("y2", d=>d.target.y);

    node.attr("transform", d=>`translate(${d.x},${d.y})`);

    edgeLabels
      .attr("x", d=> (d.source.x + d.target.x)/2 )
      .attr("y", d=> (d.source.y + d.target.y)/2 );
  });

  // 初始自适应
  resize();
})();
</script>
</body>
</html>
